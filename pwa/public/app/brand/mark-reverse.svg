  <title id="title">TBYB — 두 선택 사이, 나의 기준</title>
  <desc id="desc">같은 크기의 열린 프레임 두 개가 가운데 점을 마주 봅니다. 두 선택을 같은 기준으로 체험하고, 나에게 맞는 쪽을 고르는 비교 플랫폼의 심볼입니다.</desc>
