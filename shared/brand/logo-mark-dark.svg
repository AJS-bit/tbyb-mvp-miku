<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Try Before You Buy">
  <!-- Try Before You Buy — mark, dark backgrounds. Source: shared/brand/README.md -->
  <title>Try Before You Buy</title>
  <defs>
    <linearGradient id="tbyb-air" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3BB9A3"/><stop offset="1" stop-color="#1E8D7B"/></linearGradient>
    <linearGradient id="tbyb-pro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A74F0"/><stop offset="1" stop-color="#5E44D8"/></linearGradient>
    <mask id="tbyb-gap" maskUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="80">
      <rect x="-8" y="-8" width="80" height="80" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="4.8" stroke-linejoin="round"><rect x="5" y="24" width="33" height="23" rx="3.4"/><rect x="1" y="48.2" width="41" height="3"/></g>
    </mask>
  </defs>
  <g transform="translate(0 2.2)">
    <!-- MacBook Pro 14 — back, right, violet screen -->
    <g mask="url(#tbyb-gap)">
      <rect x="23" y="10" width="36" height="25" rx="3.6" fill="url(#tbyb-pro)"/>
      <circle cx="41" cy="11.9" r="0.75" fill="#16130F" fill-opacity="0.55"/>
      <path d="M19 36.2H63L61.6 39Q61.2 40.6 60 40.6H22Q20.8 40.6 20.4 39Z" fill="#EBE2D5"/>
    </g>
    <!-- MacBook Air — front, left, slimmer, teal screen -->
    <rect x="5" y="24" width="33" height="23" rx="3.4" fill="url(#tbyb-air)"/>
    <circle cx="21.5" cy="25.8" r="0.7" fill="#16130F" fill-opacity="0.5"/>
    <path d="M1 48.2H42L41 49.7Q40.6 51.2 39.5 51.2H3.5Q2.4 51.2 2 49.7Z" fill="#EBE2D5"/>
    <!-- spark -->
    <path d="M13.5 8Q15.04 11.96 19 13.5Q15.04 15.04 13.5 19Q11.96 15.04 8 13.5Q11.96 11.96 13.5 8Z" fill="#FF8A6B"/>
  </g>
</svg>
